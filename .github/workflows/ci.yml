name: ReCall checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: recall_test
          POSTGRES_USER: recall
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recall -d recall_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit and local integration tests
        working-directory: backend
        run: ./mvnw --batch-mode test
      - name: PostgreSQL migration and integration tests
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/recall_test
          DB_USERNAME: recall
          DB_PASSWORD: ci-only-password
        run: ./mvnw --batch-mode test -Dspring.profiles.active=pgtest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
